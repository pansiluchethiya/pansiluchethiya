name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate profile files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the YAML parser
        run: python -m pip install --quiet --upgrade pyyaml

      - name: Validate JSON, SVG, YAML, Markdown and privacy rules
        run: python scripts/validate.py
