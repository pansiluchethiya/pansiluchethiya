name: Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  update:
    name: Generate and publish the contribution snake
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: pansiluchethiya
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark

      - name: Publish the SVGs to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The action runs in a container, so the generated folder is owned by
          # root. Copy the files into a fresh directory before initialising git.
          rm -rf snake-publish
          mkdir -p snake-publish
          cp dist/*.svg snake-publish/
          cd snake-publish
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: update contribution snake"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            output
