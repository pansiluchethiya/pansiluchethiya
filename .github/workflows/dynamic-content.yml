name: Dynamic Content

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dynamic-content
  cancel-in-progress: false

jobs:
  update:
    name: Refresh quote and fun fact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate the developer quote and the fun fact
        run: |
          python scripts/generate_quote.py
          python scripts/generate_fun_fact.py

      - name: Commit the refreshed assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          if git diff --cached --quiet; then
            echo "Nothing changed this hour."
            exit 0
          fi
          git commit -q -m "chore: refresh quote and fun fact [skip ci]"
          git push
